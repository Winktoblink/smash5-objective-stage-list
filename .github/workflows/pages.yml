name: Pages

# Publishes the static search page. It needs no server: the page reads data/stages.json and evaluates
# every criterion in the browser (see docs/adr/0005-ui-evaluates-criteria-in-the-browser.md).
# One-time setup by a repository admin: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The page is plain files, so publishing it is a copy. Swagger UI is generated by Spring and is not included.
      - name: Collect the site
        run: |
          mkdir _site
          cp -R src/main/resources/static/. _site/
          test -f _site/index.html
          test -f _site/data/stages.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
