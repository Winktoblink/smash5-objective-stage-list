services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ssbu_stages
      POSTGRES_USER: ssbu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssbu -d ssbu_stages"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Only started with `docker compose --profile app up --build`, so `./gradlew bootRun`
  # (which uses this file through Spring Boot's Docker Compose support) starts Postgres alone.
  app:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ssbu_stages
      SPRING_DATASOURCE_USERNAME: ssbu
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "8080:8080"
